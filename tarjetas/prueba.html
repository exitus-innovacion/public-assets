<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba · tarjetas de Exitus para Claude</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5e5d59;--text-muted:#8f8e8a;--text-danger:#b3261e;--border:rgba(31,30,29,.15);--border-accent:#2c84db;--surface-1:#f5f4ef;--surface-2:#fff;--fill-control:rgba(31,30,29,.08);--fill-control-hover:rgba(31,30,29,.12);--fill-accent:#2c84db;--font-sans:system-ui,sans-serif;--font-mono:ui-monospace,monospace}
body{max-width:640px;margin:40px auto;background:#faf9f5;font-family:system-ui,sans-serif}
#log{margin-top:16px;font:12px ui-monospace,monospace;white-space:pre-wrap;color:#5e5d59}
</style>
</head>
<body>
<p>Así se verá la tarjeta en Claude (en modo claro; los íconos no aparecen fuera de Claude). Lo que se enviaría al chat se muestra abajo.</p>
<div class="q-card" id="q"></div>
<div id="log"></div>
<script>window.sendPrompt=function(m){document.getElementById('log').textContent='Se enviaría al chat:\n'+m};</script>
<script src="tarjetas.js"></script>
<script>
ExitusCard({title:"Paquete de Proyecto de prueba",steps:[
{key:"Prompt",q:"Copia este prompt y pégalo en un chat nuevo dentro del proyecto, en tu cuenta personal",copy:EXITUS.prompts.paquete},
{key:"Exportación",q:"¿Me pegas aquí el paquete que te devolvió?",ph:"Pega aquí el bloque de código completo",long:true,req:"Pega la respuesta para continuar",min:300,expect:["## 1","## 7"],sub:"¿La respuesta decía que estaba completa? Elige una",opts:["Sí, completa","Faltaba algo","No lo dijo"]}]});
</script>
</body>
</html>
